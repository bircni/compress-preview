<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' __CSP_SOURCE__; style-src 'unsafe-inline' __CSP_SOURCE__; font-src __CSP_SOURCE__;">
  <link rel="stylesheet" href="__CODICONS_STYLE__">
  <style>
    :root {
      --muted: var(--vscode-descriptionForeground, #8b949e);
      --accent: var(--vscode-textLink-foreground, #3794ff);
      --list-hover: var(--vscode-list-hoverBackground, rgba(255, 255, 255, 0.04));
      --list-active: var(--vscode-list-activeSelectionBackground, rgba(255, 255, 255, 0.08));
      --list-focus: var(--vscode-list-focusOutline, var(--vscode-focusBorder, #007fd4));
      --input-bg: var(--vscode-input-background, #3c3c3c);
      --input-border: var(--vscode-input-border, transparent);
      --button-bg: var(--vscode-button-secondaryBackground, #3a3d41);
      --button-fg: var(--vscode-button-secondaryForeground, #cccccc);
      --button-hover: var(--vscode-button-secondaryHoverBackground, #45494e);
      --primary-button-bg: var(--vscode-button-background, #0e639c);
      --primary-button-fg: var(--vscode-button-foreground, #ffffff);
      --primary-button-hover: var(--vscode-button-hoverBackground, #1177bb);
      --section-border: var(--vscode-sideBarSectionHeader-border, var(--vscode-panel-border, rgba(128, 128, 128, 0.35)));
      --section-bg: var(--vscode-sideBarSectionHeader-background, transparent);
      --section-fg: var(--vscode-sideBarSectionHeader-foreground, #bbbbbb);
      --tree-indent: 16px;
      --row-height: 22px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      color: var(--vscode-foreground, #cccccc);
      background: var(--vscode-editor-background, #1e1e1e);
      font-family: var(--vscode-font-family, -apple-system, BlinkMacSystemFont, sans-serif);
      font-size: var(--vscode-font-size, 13px);
      line-height: 1.4;
    }
    .shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .header {
      flex: none;
      border-bottom: 1px solid var(--section-border);
      background: var(--section-bg);
    }
    .headerTop {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 8px 20px 0;
    }
    .headerTitle {
      min-width: 0;
    }
    .sectionTitle {
      margin: 0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--section-fg);
      line-height: 22px;
    }
    .summary {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 18px;
    }
    .headerActions {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 6px 20px 8px;
    }
    .statusLine {
      margin: 0;
      padding: 0 20px 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 16px;
    }
    button,
    .linkButton,
    .filterChip {
      appearance: none;
      border: none;
      border-radius: 2px;
      background: var(--button-bg);
      color: var(--button-fg);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      line-height: 18px;
      text-decoration: none;
    }
    button:hover,
    .linkButton:hover,
    .filterChip:hover {
      background: var(--button-hover);
    }
    .headerActions button {
      padding: 1px 8px;
      min-height: 22px;
    }
    .buttonPrimary {
      background: var(--primary-button-bg);
      color: var(--primary-button-fg);
    }
    .buttonPrimary:hover {
      background: var(--primary-button-hover);
    }
    .filterChip {
      padding: 1px 6px;
      min-height: 22px;
      color: var(--muted);
      font-size: 12px;
      background: transparent;
    }
    .filterChip:hover {
      color: var(--vscode-foreground, #cccccc);
      background: var(--list-hover);
    }
    .filterChip.is-active {
      color: var(--vscode-foreground, #cccccc);
      background: var(--list-active);
      outline: 1px solid var(--list-focus);
      outline-offset: -1px;
    }
    .filterLabel {
      font-size: 12px;
      color: var(--muted);
      margin-right: 2px;
    }
    .chipRow {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 2px;
      align-items: center;
    }
    .searchInput {
      height: 26px;
      padding: 2px 6px;
      border: 1px solid var(--input-border);
      border-radius: 2px;
      background: var(--input-bg);
      color: inherit;
      font: inherit;
      font-size: 13px;
      width: min(280px, 100%);
    }
    .searchInput:focus {
      outline: 1px solid var(--list-focus);
      outline-offset: -1px;
    }
    .searchInput::placeholder {
      color: var(--muted);
    }
    .treeContainer {
      flex: 1;
      min-height: 0;
      overflow: auto;
      width: 100%;
    }
    .treeTable tbody tr.virtSpacer td {
      padding: 0;
      line-height: 0;
      border: 0;
      box-shadow: none;
      overflow: hidden;
      vertical-align: top;
    }
    .treeTable {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    body.is-col-resizing {
      cursor: col-resize;
      user-select: none;
    }
    .treeTable thead th {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 0;
      border-bottom: 1px solid var(--section-border);
      background: var(--vscode-editor-background, #1e1e1e);
      color: var(--muted);
      font-size: 12px;
      font-weight: normal;
      text-align: left;
      vertical-align: middle;
      height: var(--row-height);
    }
    .treeTable tbody td {
      padding: 0 4px;
      height: var(--row-height);
      vertical-align: middle;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .treeTable tbody td:not(.colActions) {
      box-shadow: inset -1px 0 0 var(--section-border);
    }
    .treeTable tbody tr.row.is-selected {
      background: var(--list-active);
    }
    .treeTable tbody tr.row:hover {
      background: var(--list-hover);
    }
    .treeTable tbody tr.row.is-selected:hover {
      background: var(--list-active);
    }
    .colHeader {
      appearance: none;
      border: none;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 12px;
      line-height: var(--row-height);
      padding: 0 4px;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: inherit;
      width: 100%;
      display: block;
    }
    .colHeader:hover {
      color: var(--vscode-foreground, #cccccc);
      background: var(--list-hover);
    }
    .colHeader.is-active {
      color: var(--vscode-foreground, #cccccc);
    }
    .colHeader.is-num {
      text-align: right;
    }
    .treeTable thead .colName .colHeader {
      padding-left: 58px;
    }
    .headerCheck,
    .rowCheck {
      width: 16px;
      height: 16px;
      margin: 0;
      flex: none;
      accent-color: var(--accent);
    }
    .headerCheck {
      position: absolute;
      left: 4px;
      top: 3px;
      z-index: 3;
    }
    .rowCheck {
      margin-right: 4px;
    }
    .colNameTree {
      display: flex;
      align-items: center;
      min-width: 0;
      flex: 1 1 auto;
      height: var(--row-height);
    }
    .treeTable thead .colSize,
    .treeTable thead .colCompressed,
    .treeTable thead .colModified {
      text-align: right;
    }
    .colHeaderShell {
      position: relative;
      height: var(--row-height);
    }
    .colHeader .sortMark {
      opacity: 0.85;
      margin-left: 2px;
    }
    .colResizeHandle {
      position: absolute;
      top: 0;
      right: -3px;
      width: 7px;
      height: 100%;
      cursor: col-resize;
      z-index: 2;
    }
    .colResizeHandle::before {
      content: "";
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: 3px;
      width: 1px;
      background: var(--section-border);
      pointer-events: none;
    }
    .colResizeHandle:hover::before,
    .colResizeHandle.is-active::before {
      left: 2px;
      width: 2px;
      background: var(--list-focus);
      opacity: 0.9;
    }
    .state {
      margin: 0;
      padding: 8px 20px;
      line-height: 22px;
      color: var(--muted);
    }
    #loading {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #loading::before {
      content: "";
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid var(--vscode-progressBar-background, rgba(128, 128, 128, 0.4));
      border-top-color: var(--vscode-progressBar-foreground, var(--accent));
      animation: spin 0.8s linear infinite;
      flex: none;
    }
    #error {
      display: none;
      color: var(--vscode-errorForeground, #f48771);
      background: var(--vscode-inputValidation-errorBackground, rgba(244, 135, 113, 0.1));
      border-bottom: 1px solid var(--vscode-inputValidation-errorBorder, rgba(244, 135, 113, 0.4));
    }
    #empty {
      display: none;
    }
    .colName {
      min-width: 0;
      overflow: hidden;
    }
    .colNameInner {
      display: flex;
      align-items: center;
      min-width: 0;
      height: var(--row-height);
    }
    .rowTwistieSpacer {
      width: 16px;
      height: var(--row-height);
      flex: none;
    }
    .rowToggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      padding: 0;
      margin: 0;
      border: none;
      background: transparent;
      color: var(--vscode-icon-foreground, var(--muted));
      flex: none;
      cursor: pointer;
    }
    .rowToggle.codicon::before {
      font-size: 16px;
    }
    .rowToggle:hover {
      background: transparent;
      color: var(--vscode-foreground, #cccccc);
    }
    .rowIcon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      margin-right: 6px;
      flex: none;
    }
    .rowIcon.codicon::before {
      font-size: 16px;
    }
    .row[data-kind="file"] .rowIcon {
      color: var(--vscode-icon-foreground, var(--muted));
    }
    .row[data-kind="dir"] .rowIcon {
      color: var(--vscode-symbolIcon-folderForeground, #c09553);
    }
    .rowLabel {
      min-width: 0;
      flex: 1 1 auto;
      overflow: hidden;
    }
    .rowName,
    .rowNameButton {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: var(--row-height);
    }
    .rowName {
      font-weight: normal;
    }
    .rowNameButton {
      display: block;
      width: 100%;
      padding: 0;
      border: none;
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
      font: inherit;
    }
    .rowNameButton:hover {
      background: transparent;
      color: var(--accent);
      text-decoration: none;
    }
    .colKind,
    .colSize,
    .colCompressed,
    .colModified {
      font-size: 12px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: var(--row-height);
    }
    .colKind {
      text-align: left;
    }
    .colSize,
    .colCompressed,
    .colModified {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .colActions {
      display: flex;
      gap: 2px;
      justify-content: flex-end;
      opacity: 0;
      pointer-events: none;
    }
    .row:hover .colActions,
    .row:focus-within .colActions {
      opacity: 1;
      pointer-events: auto;
    }
    .rowAction {
      padding: 0 6px;
      min-height: 20px;
      font-size: 12px;
      background: transparent;
      color: var(--vscode-foreground, #cccccc);
    }
    .rowAction:hover {
      background: var(--list-hover);
    }
    #partial {
      display: none;
      flex: none;
      margin: 0;
      padding: 6px 20px;
      border-top: 1px solid var(--section-border);
      background: var(--vscode-editorInfo-background, rgba(55, 148, 255, 0.1));
      color: var(--vscode-foreground, #cccccc);
      line-height: 22px;
      font-size: 12px;
    }
    #partial.is-error {
      background: var(--vscode-inputValidation-errorBackground, rgba(244, 135, 113, 0.1));
      color: var(--vscode-errorForeground, #f48771);
      border-top-color: var(--vscode-inputValidation-errorBorder, rgba(244, 135, 113, 0.4));
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="headerTop">
        <div class="headerTitle">
          <h2 class="sectionTitle">Archive</h2>
          <p id="summary" class="summary">Waiting for archive metadata...</p>
        </div>
        <div class="headerActions">
          <button id="refreshBtn" type="button">Refresh</button>
          <button id="expandAllBtn" type="button" style="display:none;">Expand all</button>
          <button id="collapseAllBtn" type="button" style="display:none;">Collapse all</button>
          <button id="retryBtn" type="button" style="display:none;">Retry</button>
          <button id="extractSelectedBtn" type="button" style="display:none;" disabled>Extract selected</button>
          <button id="extractAllBtn" class="buttonPrimary" type="button" style="display:none;">Extract all</button>
        </div>
      </div>
      <div class="controls">
        <input id="searchInput" class="searchInput" type="search" placeholder="Search files">
        <div class="chipRow" id="filterRow">
          <span class="filterLabel">Show</span>
          <button class="filterChip is-active" type="button" data-filter="all">All</button>
          <button class="filterChip" type="button" data-filter="files">Files</button>
          <button class="filterChip" type="button" data-filter="folders">Folders</button>
          <button class="filterChip" type="button" data-filter="text">Text</button>
          <button class="filterChip" type="button" data-filter="binary">Binary</button>
        </div>
      </div>
      <p id="statusText" class="statusLine">Preparing archive</p>
    </header>
    <div class="treeContainer" id="treeContainer">
      <div id="loading" class="state">Loading archive contents...</div>
      <div id="error" class="state"></div>
      <div id="empty" class="state">No matching archive entries for the current filter.</div>
      <table class="treeTable" id="treeTable" style="display:none;">
        <colgroup id="treeColgroup">
          <col class="colName">
          <col class="colKind">
          <col class="colSize">
          <col class="colCompressed">
          <col class="colModified">
          <col class="colActions">
        </colgroup>
        <thead>
          <tr class="treeHeader" id="treeHeader">
            <th class="colName" scope="col" data-col="name">
              <div class="colHeaderShell">
                <input id="selectAllCheck" class="headerCheck" type="checkbox" aria-label="Select all visible entries">
                <button class="colHeader" type="button" data-sort="path">Name<span class="sortMark"></span></button>
                <span class="colResizeHandle" data-col-key="name" role="separator" aria-orientation="vertical" aria-label="Resize Name column"></span>
              </div>
            </th>
            <th class="colKind" scope="col" data-col="kind">
              <div class="colHeaderShell">
                <button class="colHeader" type="button" data-sort="kind">Kind<span class="sortMark"></span></button>
                <span class="colResizeHandle" data-col-key="kind" role="separator" aria-orientation="vertical" aria-label="Resize Kind column"></span>
              </div>
            </th>
            <th class="colSize" scope="col" data-col="size">
              <div class="colHeaderShell">
                <button class="colHeader is-num" type="button" data-sort="size">Size<span class="sortMark"></span></button>
                <span class="colResizeHandle" data-col-key="size" role="separator" aria-orientation="vertical" aria-label="Resize Size column"></span>
              </div>
            </th>
            <th class="colCompressed" scope="col" data-col="compressed">
              <div class="colHeaderShell">
                <button class="colHeader is-num" type="button" data-sort="compressed">Compressed<span class="sortMark"></span></button>
                <span class="colResizeHandle" data-col-key="compressed" role="separator" aria-orientation="vertical" aria-label="Resize Compressed column"></span>
              </div>
            </th>
            <th class="colModified" scope="col" data-col="modified">
              <div class="colHeaderShell">
                <button class="colHeader is-num" type="button" data-sort="mtime">Modified<span class="sortMark"></span></button>
                <span class="colResizeHandle" data-col-key="modified" role="separator" aria-orientation="vertical" aria-label="Resize Modified column"></span>
              </div>
            </th>
            <th class="colActions" scope="col" data-col="actions" aria-hidden="true"></th>
          </tr>
        </thead>
        <tbody id="tree"></tbody>
      </table>
    </div>
    <div id="partial"></div>
  </div>
  __INITIAL_SCRIPT__
  <script>
    var TEXT_EXTENSIONS = {
      txt: true, json: true, md: true, xml: true, html: true, htm: true, css: true, js: true,
      ts: true, jsx: true, tsx: true, log: true, yml: true, yaml: true, csv: true, json5: true,
      sh: true, bat: true, cmd: true, ps1: true, r: true, py: true, sql: true, env: true,
      ini: true, cfg: true, conf: true, text: true, rst: true, adoc: true
    };
    var vscode;
    try {
      vscode = acquireVsCodeApi();
    } catch (e) {}

    var treeEl = document.getElementById('tree');
    var errorEl = document.getElementById('error');
    var emptyEl = document.getElementById('empty');
    var loadingEl = document.getElementById('loading');
    var partialEl = document.getElementById('partial');
    var extractAllBtn = document.getElementById('extractAllBtn');
    var extractSelectedBtn = document.getElementById('extractSelectedBtn');
    var selectAllCheck = document.getElementById('selectAllCheck');
    var expandAllBtn = document.getElementById('expandAllBtn');
    var collapseAllBtn = document.getElementById('collapseAllBtn');
    var retryBtn = document.getElementById('retryBtn');
    var summaryEl = document.getElementById('summary');
    var statusTextEl = document.getElementById('statusText');
    var searchInput = document.getElementById('searchInput');
    var refreshBtn = document.getElementById('refreshBtn');
    var treeTableEl = document.getElementById('treeTable');
    var treeContainerEl = document.getElementById('treeContainer');
    var sortHeaderButtons = Array.prototype.slice.call(document.querySelectorAll('[data-sort]'));
    var filterButtons = Array.prototype.slice.call(document.querySelectorAll('[data-filter]'));

    var allEntries = [];
    var rootNodes = [];
    var collapsedPaths = {};
    var selectedPaths = {};
    var lastAnchorIndex = -1;
    var visibleRows = [];
    var ROW_HEIGHT = 22;
    var ROW_OVERSCAN = 12;
    var virtRangeStart = 0;
    var virtRangeEnd = 0;
    var activeFilter = 'all';
    var searchQuery = '';
    var activeSort = 'pathAsc';
    var TABLE_COLUMNS = [
      { key: 'name', colClass: 'colName', min: 140, defaultWidth: 280 },
      { key: 'kind', colClass: 'colKind', min: 56, defaultWidth: 72 },
      { key: 'size', colClass: 'colSize', min: 64, defaultWidth: 88 },
      { key: 'compressed', colClass: 'colCompressed', min: 72, defaultWidth: 96 },
      { key: 'modified', colClass: 'colModified', min: 120, defaultWidth: 168 },
      { key: 'actions', colClass: 'colActions', min: 72, defaultWidth: 88 }
    ];

    function defaultColumnWidths() {
      var widths = {};
      TABLE_COLUMNS.forEach(function(col) {
        widths[col.key] = col.defaultWidth;
      });
      return widths;
    }

    function loadColumnLayout() {
      var saved = vscode && vscode.getState ? vscode.getState() : null;
      if (saved && saved.columnWidths) {
        return {
          columnWidths: Object.assign(defaultColumnWidths(), saved.columnWidths),
          userSizedName: Boolean(saved.userSizedName)
        };
      }
      return { columnWidths: defaultColumnWidths(), userSizedName: false };
    }

    var columnLayout = loadColumnLayout();
    var columnWidths = columnLayout.columnWidths;
    var userSizedName = columnLayout.userSizedName;
    var columnResizersInstalled = false;

    function saveColumnLayout() {
      if (vscode && vscode.setState) {
        vscode.setState({ columnWidths: columnWidths, userSizedName: userSizedName });
      }
    }

    function getColumnDef(key) {
      for (var i = 0; i < TABLE_COLUMNS.length; i += 1) {
        if (TABLE_COLUMNS[i].key === key) return TABLE_COLUMNS[i];
      }
      return null;
    }

    function applyColumnWidths() {
      TABLE_COLUMNS.forEach(function(col) {
        var colEl = document.querySelector('#treeColgroup col.' + col.colClass);
        if (colEl && columnWidths[col.key] != null) {
          colEl.style.width = columnWidths[col.key] + 'px';
        }
      });
    }

    function sumColumnWidths(exceptKey) {
      var total = 0;
      TABLE_COLUMNS.forEach(function(col) {
        if (exceptKey && col.key === exceptKey) return;
        total += columnWidths[col.key] || col.defaultWidth;
      });
      return total;
    }

    function layoutTableColumns() {
      if (!treeTableEl || treeTableEl.style.display === 'none') return;
      var tableWidth = treeTableEl.clientWidth;
      if (!tableWidth) return;
      var nameCol = getColumnDef('name');
      var othersSum = sumColumnWidths('name');
      if (!userSizedName) {
        columnWidths.name = Math.max(nameCol.min, tableWidth - othersSum);
      } else {
        columnWidths.name = Math.max(nameCol.min, Math.min(columnWidths.name, tableWidth - othersSum));
      }
      applyColumnWidths();
    }

    function installColumnResizers() {
      if (columnResizersInstalled) return;
      columnResizersInstalled = true;
      document.querySelectorAll('.colResizeHandle').forEach(function(handle) {
        handle.addEventListener('mousedown', function(e) {
          e.preventDefault();
          e.stopPropagation();
          var colKey = handle.getAttribute('data-col-key');
          var colDef = getColumnDef(colKey);
          if (!colDef) return;
          var startX = e.clientX;
          var startWidth = columnWidths[colKey] || colDef.defaultWidth;
          handle.classList.add('is-active');
          document.body.classList.add('is-col-resizing');

          function onMove(ev) {
            var nextWidth = Math.max(colDef.min, startWidth + (ev.clientX - startX));
            columnWidths[colKey] = nextWidth;
            if (colKey === 'name') {
              userSizedName = true;
              applyColumnWidths();
              return;
            }
            userSizedName = false;
            var tableWidth = treeTableEl.clientWidth;
            var othersSum = sumColumnWidths('name');

      if (isPartial && message && partialEl) {
        partialEl.style.display = 'block';
        partialEl.innerHTML = 'Showing a partial entry list. ' + escapeHtml(message) + ' <button id="retryBtnInline" type="button">Retry</button>';
        var retryBtnInline = document.getElementById('retryBtnInline');
        if (retryBtnInline && vscode) {
          retryBtnInline.onclick = function() { vscode.postMessage({ type: 'retryLoad' }); };
        }
      }
    }

    function setError(message) {
      allEntries = [];
      rootNodes = [];
      if (loadingEl) loadingEl.style.display = 'none';
      if (treeEl) treeEl.innerHTML = '';
      if (treeTableEl) treeTableEl.style.display = 'none';
      if (emptyEl) emptyEl.style.display = 'none';
      if (extractAllBtn) extractAllBtn.style.display = 'none';
      if (extractSelectedBtn) extractSelectedBtn.style.display = 'none';
      selectedPaths = {};
      lastAnchorIndex = -1;
      visibleRows = [];
      updateFolderButtons();
      if (errorEl) {
        errorEl.style.display = 'block';
        errorEl.textContent = message || 'Error';
      }
      setStatus('Could not read archive');
      setSummary('The preview could not be rendered.');
      showRetry(true);
    }

    function installControls() {
      updateFilterButtons();
      filterButtons.forEach(function(button) {
        button.addEventListener('click', function() {
          var nextFilter = button.getAttribute('data-filter') || 'all';
          if (activeFilter === nextFilter) return;
          activeFilter = nextFilter;
          updateFilterButtons();
          renderEntries();
        });
      });
      if (searchInput) {
        searchInput.addEventListener('input', function() {
          searchQuery = (searchInput.value || '').trim().toLowerCase();
          renderEntries();
        });
      }
      sortHeaderButtons.forEach(function(button) {
        button.addEventListener('click', function() {
          var column = button.getAttribute('data-sort');
          if (!column) return;
          toggleSort(column);
        });
      });
      if (expandAllBtn) {
        expandAllBtn.addEventListener('click', function() {
          setAllFoldersCollapsed(false);
          renderEntries();
        });
      }
      if (collapseAllBtn) {
        collapseAllBtn.addEventListener('click', function() {
          setAllFoldersCollapsed(true);
          renderEntries();
        });
      }
      if (selectAllCheck) {
        selectAllCheck.addEventListener('click', function(event) {
          event.stopPropagation();
          var next = selectAllCheck.checked;
          visibleRows.forEach(function(row) {
            setPathSelected(row.node.entry.path, next);
          });
          lastAnchorIndex = next && visibleRows.length ? 0 : -1;
          renderEntries();
        });
      }
    }

    installControls();
    installColumnResizers();
    updateSortHeaders();
    layoutTableColumns();
    if (treeContainerEl) {
      treeContainerEl.addEventListener('scroll', function() {
        var range = getVirtualRange(visibleRows.length);
        if (range.start === virtRangeStart && range.end === virtRangeEnd) return;
        paintTreeRows();
      });
    }

    if (refreshBtn) {
      refreshBtn.addEventListener('click', function() {
        if (vscode) vscode.postMessage({ type: 'getEntries' });
      });
    }

    var hasInitialData = false;
    var initialEl = document.getElementById('initial-entries');
    if (initialEl && initialEl.textContent) {
      try {
        var data = JSON.parse(initialEl.textContent);
        hasInitialData = true;
        if (data.error) {
          setError(data.error);
        } else {
          setEntries(data.entries || [], data.isPartial, data.message);
        }
      } catch (err) {}
    }

    window.addEventListener('message', function(e) {
      var msg = e.data;
      if (msg.type === 'init') {
        if (vscode) vscode.postMessage({ type: 'getEntries' });
      } else if (msg.type === 'loading') {
        if (loadingEl) loadingEl.style.display = msg.show ? 'flex' : 'none';
        if (msg.show) {
          setStatus('Reading archive');
          setSummary('Loading archive contents...');
          showRetry(false);
        }
      } else if (msg.type === 'error') {
        setError(msg.message || 'Error');
      } else if (msg.type === 'entries') {
        setEntries(msg.entries || [], msg.isPartial, msg.message);
      } else if (msg.type === 'copyResult') {
        if (msg.success === false && msg.error) {
          if (partialEl) {
            partialEl.style.display = 'block';
            partialEl.className = 'is-error';
            partialEl.innerHTML = escapeHtml(msg.error);
          }
        } else if (msg.success === true && msg.path) {
          showResultMessage('Copied path', msg.path);
        }
      } else if (msg.type === 'openResult' || msg.type === 'extractResult') {
        if (msg.success === false && msg.error) {
          if (partialEl) {
            partialEl.style.display = 'block';
            partialEl.className = 'is-error';
            partialEl.innerHTML = escapeHtml(msg.error);
          }
        } else if (msg.success === true && msg.targetPath) {
          showResultMessage(msg.type === 'openResult' ? 'Opened preview' : 'Extracted to', msg.targetPath);
        }
      }
    });

    if (retryBtn) retryBtn.addEventListener('click', function() { if (vscode) vscode.postMessage({ type: 'retryLoad' }); });
    if (extractSelectedBtn) {
      extractSelectedBtn.addEventListener('click', function() {
        var paths = selectedPathList();
        if (!vscode || !paths.length) return;
        vscode.postMessage({ type: 'extractSelected', paths: paths });
      });
    }
    if (extractAllBtn) extractAllBtn.addEventListener('click', function() { if (vscode) vscode.postMessage({ type: 'extractAll' }); });
    if (vscode && !hasInitialData) {
      vscode.postMessage({ type: 'getEntries' });
    }
  </script>
</body>
</html>
